name: Browser interoperability tests

on:
  workflow_call:
    inputs:
      webrtc-repository:
        description: Repository containing the WebRTC implementation to test
        type: string
        default: pion/webrtc
      webrtc-ref:
        description: WebRTC branch, tag, or commit to test
        type: string
        default: main
      interceptor-repository:
        description: Optional repository containing the interceptor implementation to test
        type: string
        default: ''
      interceptor-ref:
        description: Interceptor branch, tag, or commit to test when a repository is supplied
        type: string
        default: main
      interop-repository:
        description: Repository containing the browser interop suite
        type: string
        default: pion/browser-tests
      interop-ref:
        description: Browser interop branch, tag, or commit to run
        type: string
        default: main
      require-opus-red:
        description: RED requirement mode (empty, pion with strict Chrome, or 1 for all browsers)
        type: string
        default: ''
      opus-red-suite:
        description: Optional RED selection (quick, stress, or soak)
        type: string
        default: ''
      junit-path:
        description: Optional JUnit XML output path for each browser job
        type: string
        default: ''

permissions:
  contents: read

jobs:
  interop:
    name: ${{ matrix.browser }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ inputs.opus-red-suite == 'soak' && 45 || 15 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            browser: chrome
          - os: ubuntu-latest
            browser: firefox
          - os: windows-latest
            browser: chrome
          - os: windows-latest
            browser: edge
          - os: macos-latest
            browser: safari
    steps:
      - name: Check out browser interop
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.interop-repository }}
          ref: ${{ inputs.interop-ref }}
          persist-credentials: false

      - name: Check out WebRTC
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.webrtc-repository }}
          ref: ${{ inputs.webrtc-ref }}
          path: webrtc
          persist-credentials: false

      - name: Check out interceptor
        if: inputs.interceptor-repository != ''
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.interceptor-repository }}
          ref: ${{ inputs.interceptor-ref }}
          path: interceptor
          persist-credentials: false

      - name: Run browser interoperability tests
        uses: ./
        with:
          webrtc-path: webrtc
          interceptor-path: ${{ inputs.interceptor-repository != '' && 'interceptor' || '' }}
          browser: ${{ matrix.browser }}
          require-opus-red: ${{ inputs.require-opus-red == 'pion' && matrix.browser == 'chrome' && '1' || inputs.require-opus-red }}
          opus-red-suite: ${{ inputs.opus-red-suite }}
          junit-path: ${{ inputs.junit-path }}

      - name: Upload browser test evidence
        if: always() && inputs.junit-path != ''
        uses: actions/upload-artifact@v7
        with:
          name: browser-interop-${{ matrix.os }}-${{ matrix.browser }}
          path: |
            ${{ inputs.junit-path }}
            .vitest-attachments/
            test/**/__screenshots__/
            stress/**/__screenshots__/
          include-hidden-files: true
          if-no-files-found: warn
